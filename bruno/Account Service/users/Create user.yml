info:
  name: Create user
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "email": "john.doe@example.com",
        "phone": "+994501234567"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: https://account-service-d1y8.onrender.com
    - name: api_key
      value: MGX_204406

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

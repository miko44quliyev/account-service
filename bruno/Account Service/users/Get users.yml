info:
  name: Get users
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
    - name: api
      value: MGX_204406
    - name: api_key
      value: MGX_204406

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
